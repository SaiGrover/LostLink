<div class="empty{% if compact %} empty--sm{% endif %}">
  <div class="empty__mark" aria-hidden="true"><i></i><b></b><i></i></div>
  <p class="empty__title">{{ title }}</p>
  {% if text %}<p>{{ text }}</p>{% endif %}
  {% if action_url %}<a class="btn btn-sm" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
</div>
