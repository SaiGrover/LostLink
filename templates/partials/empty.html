{% load ui %}<div class="empty{% if compact %} empty--compact{% endif %}">
  <div class="empty__mark">{% icon icon|default:'inbox' %}</div>
  <h3>{{ title }}</h3>
  {% if text %}<p>{{ text }}</p>{% endif %}
  {% if action_url %}<a class="btn btn-secondary btn-sm" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
</div>
