{% extends 'base.html' %}
{% block title %}403{% endblock %}
{% block body %}
<main class="error" id="main-content">
  <div>
    <span class="num" aria-hidden="true">403</span>
    <h1>This isn’t <em>open</em> to you.</h1>
    <p>{% if exception %}{{ exception }}{% else %}Your account doesn’t have permission for this page or action.{% endif %}</p>
    <div class="cluster" style="justify-content:center"><a href="/dashboard/" class="btn btn-ink">Back to your desk</a><a href="/search/" class="btn">Walk the wall</a></div>
  </div>
</main>
{% endblock %}
