{% extends 'base.html' %}
{% block title %}Something went wrong{% endblock %}
{% block body %}
<main class="error-page" id="main-content">
  <div>
    <span class="code">500 · Server error</span>
    <h1>Something went wrong on our side.</h1>

  </div>
</main>
{% endblock %}
