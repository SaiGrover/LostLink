services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lostlink
      POSTGRES_USER: lostlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - lostlink_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lostlink']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lostlink_db:
